name: Release

# Native installers can only be built on the OS they run on, so this workflow
# runs one job per platform: an MSI on Windows, DMGs for both Mac architectures,
# and a DEB plus an RPM on Ubuntu (covering Debian/Ubuntu/Mint and
# Fedora/RHEL/openSUSE). The runnable jar is built once and shipped too.
#
# The client mod is built first and copied into client-libs/<minecraft version>/
# before the launcher builds, so every launcher carries the client and one
# launcher version is one client version. The release tag also sets the launcher
# version, which is what the launcher's updater compares against.
#
# checksums.txt must stay in `sha256sum` form ("<hash>  <file>") because the
# download page at Mix-Studios/Mix-Client parses it to show the hash.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}

jobs:
  client:
    name: Client mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the client mod
        working-directory: Client/26.3/mixclient
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Keep the client jar in the run
        uses: actions/upload-artifact@v4
        with:
          name: client-26.3
          path: Client/26.3/mixclient/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  jar:
    name: Runnable jar
    needs: [client]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the client mod
        uses: actions/download-artifact@v4
        with:
          name: client-26.3
          path: client-libs/26.3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the runnable jar
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          chmod +x gradlew
          ./gradlew --no-daemon fatJar \
            -PlauncherVersion="$version" \
            -PclientVersion="$version"
          # The client must actually be inside the launcher.
          unzip -l build/libs/*-all.jar client/index.json >/dev/null

      - name: Collect the jar
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/libs/*-all.jar dist/
          ls -l dist

      - name: Keep the jar in the run
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installer:
    name: ${{ matrix.label }}
    needs: [client]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: msi
            label: Windows x64 (MSI)
            asset: windows-x64.msi
          - os: macos-latest # Apple silicon
            type: dmg
            label: macOS Apple silicon (DMG)
            asset: macos-arm64.dmg
          - os: macos-26-intel # Intel
            type: dmg
            label: macOS Intel (DMG)
            asset: macos-x64.dmg
          - os: ubuntu-24.04
            type: deb
            label: Linux Debian/Ubuntu (DEB)
            asset: linux-amd64.deb
          - os: ubuntu-24.04
            type: rpm
            label: Linux Fedora/RHEL (RPM)
            asset: linux-x86_64.rpm
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the client mod
        uses: actions/download-artifact@v4
        with:
          name: client-26.3
          path: client-libs/26.3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Linux packaging tools jpackage needs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install WiX Toolset 3 for the MSI bundler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          }

      - name: Build the installer
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          chmod +x gradlew
          ./gradlew --no-daemon packageInstaller \
            -PinstallerType=${{ matrix.type }} \
            -PlauncherVersion="$version" \
            -PclientVersion="$version"

      - name: Collect the installer
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          src=$(find build/installer/dist -maxdepth 1 -type f \
            \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) | head -1)
          test -n "$src"
          cp "$src" "dist/MixClient-${version}-installer-${{ matrix.asset }}"
          ls -l dist

      - name: Keep the installer in the run
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [jar, installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every built file
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums.txt
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.jar,dist/*.msi,dist/*.dmg,dist/*.deb,dist/*.rpm"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          {
            echo "Installers for Windows, macOS (Apple silicon and Intel) and Linux (DEB and RPM), plus the plain runnable jar. Each one bundles its own Java runtime."
            echo
            echo "The client mod is inside every download: the launcher installs the matching client into your mods folder when you press Play, and the launcher updates itself when a newer version is released."
            echo
            echo "The builds are unsigned. macOS blocks the first launch of an unsigned app: right-click MixClient in Applications and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/MixClient.app\`. Windows shows a SmartScreen prompt: choose More info, then Run anyway."
            echo
            echo "**checksums.txt**"
            echo
            echo '```'
            cat dist/checksums.txt
            echo '```'
            echo
            echo "**Verify**"
            echo
            echo '```sh'
            echo "sha256sum -c checksums.txt    # macOS: shasum -a 256 -c checksums.txt"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

          files=(dist/*)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Mix Client $tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
