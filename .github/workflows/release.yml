name: Release

# Native installers can only be built on the OS they run on, so this workflow
# runs one job per platform: an MSI on Windows, DMGs for both Mac architectures,
# and a DEB plus an RPM on Ubuntu (covering Debian/Ubuntu/Mint and
# Fedora/RHEL/openSUSE). The runnable jar is built once and shipped too.
#
# The client mod is built first and copied into client-libs/<minecraft version>/
# before the launcher builds, so every launcher carries the client and one
# launcher version is one client version. The release tag also sets the launcher
# version, which is what the launcher's updater compares against.
#
# checksums.txt must stay in `sha256sum` form ("<hash>  <file>") because the
# download page at Mix-Studios/Mix-Client parses it to show the hash.
#
# latest.json is the machine-readable update feed the launcher reads at startup:
# version, pre-release flag, and one entry per file with platform, arch, format,
# size, SHA-256 and download URL. It is uploaded next to checksums.txt and is
# deliberately not listed inside checksums.txt. It is attested with the builds,
# so an updater can verify the feed itself before trusting the URLs inside it.
#
# Tags that name a test build (Test, 1.2.0-beta.1, rc1) or that are not a plain
# version (v1.2.3) are published as GitHub pre-releases. GitHub's "latest" then
# keeps pointing at the stable build, so a test tag cannot take over the site's
# download button or /releases/latest. The site lists pre-releases on its own
# test-builds page instead.

on:
  push:
    # Every tag publishes: a plain version (v1.2.3) as a normal release, and any
    # other tag (Test, v1.2.0-beta.1, nightly-*) as a pre-release, which GitHub's
    # "latest" and the site's download button both skip.
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}

jobs:
  client:
    name: Client mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the client mod
        working-directory: Client/26.3/mixclient
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Keep the client jar in the run
        uses: actions/upload-artifact@v4
        with:
          name: client-26.3
          path: Client/26.3/mixclient/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  client-legacy:
    name: Client mod (1.8.9)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # ForgeGradle 2.1 and its Gradle 4.4.1 wrapper only run on Java 8.
      - name: Build the 1.8.9 client mod
        working-directory: Client/1.8.9/cloudclient
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon build -PclientVersion="${VERSION#v}"

      - name: Keep the 1.8.9 client jar in the run
        uses: actions/upload-artifact@v4
        with:
          name: client-1.8.9
          path: Client/1.8.9/cloudclient/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  jar:
    name: Runnable jar
    needs: [client, client-legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the 26.3 client mod
        uses: actions/download-artifact@v4
        with:
          name: client-26.3
          path: client-libs/26.3

      - name: Fetch the 1.8.9 client mod
        uses: actions/download-artifact@v4
        with:
          name: client-1.8.9
          path: client-libs/1.8.9

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the runnable jar
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          chmod +x gradlew
          ./gradlew --no-daemon fatJar \
            -PlauncherVersion="$version" \
            -PclientVersion="$version" \
            -PrequireClients=1.8.9,26.3

      # A client change ships as a new launcher version or not at all: the embedded
      # jars, the client version in the index and the launcher version are one release.
      - name: Check the embedded clients match the release
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          unzip -p build/libs/*-all.jar client/index.json > client-index.json
          python3 - "$version" client-index.json <<'PY'
          import json, sys

          version, path = sys.argv[1], sys.argv[2]
          index = json.load(open(path))
          assert index["clientVersion"] == version, (
              f"client/index.json says {index['clientVersion']}, the release is {version}")
          modules = {m["gameVersion"]: m["file"] for m in index["modules"]}
          missing = {"1.8.9", "26.3"} - set(modules)
          assert not missing, f"no client jar for {sorted(missing)}"
          print("embedded clients:", ", ".join(f"{v} -> {f}" for v, f in sorted(modules.items())))
          PY

      - name: Collect the jar
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/libs/*-all.jar dist/
          ls -l dist

      - name: Keep the jar in the run
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installer:
    name: ${{ matrix.label }}
    needs: [client, client-legacy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: msi
            label: Windows x64 (MSI)
            asset: windows-x64.msi
          - os: macos-latest # Apple silicon
            type: dmg
            label: macOS Apple silicon (DMG)
            asset: macos-arm64.dmg
          - os: macos-26-intel # Intel
            type: dmg
            label: macOS Intel (DMG)
            asset: macos-x64.dmg
          - os: ubuntu-24.04
            type: deb
            label: Linux Debian/Ubuntu (DEB)
            asset: linux-amd64.deb
          - os: ubuntu-24.04
            type: rpm
            label: Linux Fedora/RHEL (RPM)
            asset: linux-x86_64.rpm
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the 26.3 client mod
        uses: actions/download-artifact@v4
        with:
          name: client-26.3
          path: client-libs/26.3

      - name: Fetch the 1.8.9 client mod
        uses: actions/download-artifact@v4
        with:
          name: client-1.8.9
          path: client-libs/1.8.9

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Linux packaging tools jpackage needs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install WiX Toolset 3 for the MSI bundler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          }

      - name: Build the installer
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          chmod +x gradlew
          ./gradlew --no-daemon packageInstaller \
            -PinstallerType=${{ matrix.type }} \
            -PlauncherVersion="$version" \
            -PclientVersion="$version" \
            -PrequireClients=1.8.9,26.3

      - name: Collect the installer
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          src=$(find build/installer/dist -maxdepth 1 -type f \
            \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) | head -1)
          test -n "$src"
          cp "$src" "dist/MixClient-${version}-installer-${{ matrix.asset }}"
          ls -l dist

      - name: Keep the installer in the run
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [jar, installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch every built file
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums.txt
        working-directory: dist
        run: |
          set -euo pipefail
          # Build files only: checksums.txt never lists itself, and latest.json is
          # metadata written afterwards.
          : > checksums.txt
          for file in *; do
            # Skip checksums.txt itself and macOS metadata (._*) files.
            case "$file" in
              checksums.txt|._*) continue ;;
            esac
            if [ -f "$file" ]; then
              sha256sum "$file" >> checksums.txt
            fi
          done
          LC_ALL=C sort -o checksums.txt checksums.txt
          cat checksums.txt

      - name: Write latest.json
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          # format -> (platform, arch); the arch is refined from the file name.
          FORMATS = {
              ".msi": ("windows", "x64"),
              ".dmg": ("macos", None),
              ".deb": ("linux", "x64"),
              ".rpm": ("linux", "x64"),
              ".jar": ("any", "any"),
          }

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          files = []
          for name in sorted(os.listdir(".")):
              if not os.path.isfile(name) or name in {"checksums.txt", "latest.json"}:
                  continue
              if name.startswith("._"):
                  continue
              ext = os.path.splitext(name)[1].lower()
              if ext not in FORMATS:
                  continue

              platform, arch = FORMATS[ext]
              if arch is None:
                  if re.search(r"arm64|aarch64", name, re.I):
                      arch = "arm64"
                  elif re.search(r"x64|x86_64|amd64", name, re.I):
                      arch = "x64"
                  else:
                      arch = "any"

              files.append({
                  "name": name,
                  "platform": platform,
                  "arch": arch,
                  "format": ext.lstrip("."),
                  "installer": ext != ".jar",
                  "size": os.path.getsize(name),
                  "sha256": sha256(name),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              })

          def is_prerelease_tag(tag):
              lowered = tag.lower()
              named = re.search(
                  r"(^|[^a-z])(test|beta|alpha|preview|snapshot|nightly|canary|rc\d*)([^a-z]|$)",
                  lowered,
              )
              shaped = re.match(r"^v?\d+(\.\d+)*$", lowered)
              return bool(named) or not shaped

          latest = {
              "schema": 1,
              "version": tag,
              "version_number": tag.lstrip("vV"),
              "name": f"Mix Client {tag}",
              "published_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "prerelease": is_prerelease_tag(tag),
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "checksums_url": f"https://github.com/{repo}/releases/download/{tag}/checksums.txt",
              "files": files,
          }

          with open("latest.json", "w", encoding="utf-8") as handle:
              json.dump(latest, handle, indent=2)
              handle.write("\n")

          print(json.dumps(latest, indent=2))
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          # latest.json is attested with the installers: it is the file that names
          # the URLs, sizes and hashes the launcher is about to trust.
          subject-path: "dist/*.jar,dist/*.msi,dist/*.dmg,dist/*.deb,dist/*.rpm,dist/latest.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # Same rule as latest.json: a tag that names a test build, or that is not
          # a plain version, becomes a pre-release so /releases/latest keeps the
          # stable build.
          lower="$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')"
          prerelease="--prerelease"
          if [[ "$lower" =~ ^v?[0-9]+(\.[0-9]+)*$ ]] &&
             [[ ! "$lower" =~ (^|[^a-z])(test|beta|alpha|preview|snapshot|nightly|canary|rc[0-9]*)([^a-z]|$) ]]; then
            prerelease=""
          fi

          {
            echo "Installers for Windows, macOS (Apple silicon and Intel) and Linux (DEB and RPM), plus the plain runnable jar. Each one bundles its own Java runtime."
            echo
            echo "The client mod is inside every download: the launcher installs the matching client into your mods folder when you press Play, and the launcher updates itself when a newer version is released."
            echo
            echo "The builds are unsigned. macOS blocks the first launch of an unsigned app: right-click MixClient in Applications and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/MixClient.app\`. Windows shows a SmartScreen prompt: choose More info, then Run anyway."
            echo
            echo "**checksums.txt**"
            echo
            echo '```'
            cat dist/checksums.txt
            echo '```'
            echo
            echo "**Machine-readable**"
            echo
            echo "\`latest.json\` lists the version and every file with its platform, size and SHA-256, so the launcher can check for its own update. It is attested with the builds, so the feed itself can be verified before its URLs are trusted."
            echo
            echo "**Verify**"
            echo
            echo '```sh'
            echo "sha256sum -c checksums.txt    # macOS: shasum -a 256 -c checksums.txt"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify latest.json --repo $GITHUB_REPOSITORY"
            echo '```'
            if [ -n "$prerelease" ]; then
              echo
              echo "**Test build.** This tag is not a stable version, so it is published as a pre-release and is not offered as the main download."
            fi
          } > "$RUNNER_TEMP/notes.md"

          files=(dist/*)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            # A test tag published before this rule existed gets fixed up.
            if [ -n "$prerelease" ]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease
            fi
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Mix Client $tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease
          fi
